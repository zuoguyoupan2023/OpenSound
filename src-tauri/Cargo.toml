[package]
name = "opensound"
version = "0.1.0"
description = "OpenSound 桌面 App：本地语音服务（ASR/TTS/LLM）+ 开放后端"
edition = "2021"
rust-version = "1.77"

[lib]
name = "opensound_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
cpal = "0.15"
base64 = "0.22"
zip = "0.6"
fs2 = "0.4"
tauri-plugin-dialog = "2"
# 000-plan-6 阶段1：系统朗读（Win=WinRT / Mac=AVSpeechSynthesizer）；锁版本试运行
tauri-plugin-tts = "=0.1.13"

[profile.dev]
# 省磁盘：关闭 debuginfo、合并符号（Tauri dev 调试已足够）
debug = 0
split-debuginfo = "packed"
[profile.dev.package."*"]
opt-level = 1

# 000-plan-6 阶段1：系统识别（macOS SFSpeechRecognizer 兜底；Win 系统识别为云端，不接）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-speech = { version = "0.3", features = ["block2"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSLocale", "NSString", "NSError"] }
block2 = "0.6"
